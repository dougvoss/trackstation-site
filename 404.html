<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faixa não encontrada — TrackStation</title>
<!-- Página de erro não deve ser indexada nem compartilhada: sem canonical, sem
     Open Graph, e com noindex. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1116">
<link rel="icon" href="assets/favicon.png" sizes="32x32">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="barra">
  <div class="barra-conteudo">
    <span class="marca">
      <img src="assets/icon-80.png" width="40" height="40" alt="">
      <span class="marca-nome">TrackStation<span class="reg">®</span></span>
    </span>
    <span class="rot estado">Em desenvolvimento</span>
  </div>
</div>

<main>

  <!-- O 404 padrão do GitHub Pages é uma página branca com a marca do GitHub:
       o visitante conclui que o site quebrou, não que errou a URL. Vinte linhas
       na mesma identidade custam menos que essa dúvida. Sem <script>: aqui não
       há contato a montar. -->
  <header class="hero">
    <p class="rot eyebrow">Erro 404</p>
    <h1>
      <span class="linha">Essa faixa</span>
      <span class="linha">não está no setlist.</span>
    </h1>
    <p class="sub">
      O endereço que você abriu não existe — ou não existe mais. A página
      inicial continua no lugar.
    </p>
    <p class="volta"><a class="botao rot" href="/">Voltar ao início</a></p>
  </header>

  <footer class="rodape">
    <p class="assinatura">TrackStation · by Douglas Voss</p>
  </footer>

</main>

</body>
</html>
