<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TrackStation — cartão de compartilhamento</title>
<style>
  /* Cartão de compartilhamento (og:image), 1200x630 fixo.
     Mesma paleta, tipografia e direção do site — painel de palco, rótulo
     serigrafado, os dois canais em cor. Fontes locais, sem CDN. */
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../assets/fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
  }

  @font-face {
    font-family: 'Space Mono';
    src: url('../assets/fonts/space-mono-latin.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }

  :root {
    --ground: #0E1116;
    --panel: #12171E;
    --line: #2A313B;
    --text: #EAEEF3;
    --muted: #8A94A3;
    --amber: #F5B841;
    --cyan: #35C6D6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--ground);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }

  .cartao {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
  }

  .rot {
    font: 400 18px/1 'Space Mono', monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .barra {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 64px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .marca { display: flex; align-items: center; gap: 16px; }
  .marca img { width: 56px; height: 56px; display: block; }
  .marca-nome { font-weight: 700; font-size: 34px; letter-spacing: -0.02em; }
  .reg {
    font-size: 14px;
    font-weight: 400;
    vertical-align: 15px;
    letter-spacing: 0;
    color: var(--muted);
  }

  .corpo {
    flex: 1;
    padding: 0 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 48px;
  }

  h1 {
    margin: 0;
    font-weight: 700;
    font-size: 74px;
    line-height: 1.06;
    letter-spacing: -0.035em;
  }

  .linha { display: block; }
  .vs { color: var(--cyan); }
  .click { color: var(--amber); }

  /* Os dois canais, a mesma tira do site: medidor segmentado em currentColor,
     então a pista é o canal e não uma barra com cor própria. */
  .canais {
    display: grid;
    grid-template-columns: max-content 560px max-content;
    align-items: center;
    gap: 14px 28px;
  }

  .canal { display: contents; }
  .canal-nome { grid-column: 1; color: currentColor; }
  .canal-destino { grid-column: 3; font-size: 16px; }

  .pista {
    grid-column: 2;
    height: 10px;
    background-image: repeating-linear-gradient(90deg,
      currentColor 0 3px, transparent 3px 8px);
  }

  .rodape {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 64px 40px;
  }
</style>
</head>
<body>
  <div class="cartao">

    <div class="barra">
      <span class="marca">
        <img src="../assets/icon.png" alt="">
        <span class="marca-nome">TrackStation<span class="reg">®</span></span>
      </span>
      <span class="rot">Ferramenta de palco</span>
    </div>

    <div class="corpo">
      <h1>
        <span class="linha"><span class="vs">VS</span> num canal.</span>
        <span class="linha"><span class="click">Click</span> no outro.</span>
        <span class="linha">O show inteiro no seu pé.</span>
      </h1>

      <div class="canais">
        <div class="canal vs">
          <span class="rot canal-nome">VS</span>
          <span class="pista"></span>
          <span class="rot canal-destino">Vai para o PA</span>
        </div>
        <div class="canal click">
          <span class="rot canal-nome">Click</span>
          <span class="pista"></span>
          <span class="rot canal-destino">Fica no fone</span>
        </div>
      </div>
    </div>

    <div class="rodape">
      <span class="rot">Playback ao vivo para músicos</span>
      <span class="rot">trackstation.com.br</span>
    </div>

  </div>
</body>
</html>
